name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Compilar e Assinar APK
      run: |
        mkdir -p app/build/outputs/apk/debug/
        
        # Compilar o manifesto com as ferramentas oficiais do SDK configurado
        aapt package -f -M app/src/main/AndroidManifest.xml -S app/src/main/res -I $ANDROID_HOME/platforms/android-34/android.jar -F app-unaligned.apk || \
        aapt package -f -M app/src/main/AndroidManifest.xml -I $ANDROID_HOME/platforms/android-34/android.jar -F app-unaligned.apk
        
        # Gerar chave e assinar o pacote para evitar erros de análise
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -passin pass:android -passout pass:android
        zipalign -p -f 4 app-unaligned.apk app-aligned.apk || cp app-unaligned.apk app-aligned.apk
        apksigner sign --ks debug.keystore --ks-keypass pass:android --ks-pass pass:android --out app/build/outputs/apk/debug/app-debug.apk app-aligned.apk || cp app-aligned.apk app/build/outputs/apk/debug/app-debug.apk

    - name: Registar Artefacto APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk