name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Esqueleto Gradle e Projeto
      run: |
        # Criar settings.gradle se não existir
        if [ ! -f settings.gradle ]; then
          echo "include ':app'" > settings.gradle
        fi

        # Criar build.gradle raiz se não existir
        if [ ! -f build.gradle ]; then
          echo "buildscript { repositories { google(); mavenCentral() } } allprojects { repositories { google(); mavenCentral() } }" > build.gradle
        fi

        # Criar estrutura mínima do app se não existir
        mkdir -p app/src/main
        if [ ! -f app/build.gradle ]; then
          echo "apply plugin: 'com.android.application'
          android {
              compileSdk 33
              namespace 'com.fhp.macro'
              defaultConfig {
                  applicationId 'com.fhp.macro'
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName '1.0'
              }
          }" > app/build.gradle
        fi

        if [ ! -f app/src/main/AndroidManifest.xml ]; then
          echo '' > app/src/main/AndroidManifest.xml
        fi

        # Gerar o gradle wrapper automaticamente
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew

    - name: Compilar APK com Gradle
      run: ./gradlew assembleDebug

    - name: Registar Artefacto APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk