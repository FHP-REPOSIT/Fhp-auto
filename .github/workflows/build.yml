name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Compilar e Assinar APK com Ferramentas Android
      run: |
        sudo apt-get update && sudo apt-get install -y aapt apksigner
        
        # Criar diretórios de output
        mkdir -p app/build/outputs/apk/debug/
        
        # Compilar o manifesto e os recursos básicos
        aapt package -f -M app/src/main/AndroidManifest.xml -S app/src/main/res -I /usr/lib/android-sdk/platforms/android-34/android.jar -F app-unaligned.apk || \
        aapt package -f -M app/src/main/AndroidManifest.xml -I /usr/lib/android-sdk/platforms/android-34/android.jar -F app-unaligned.apk
        
        # Gerar keystore temporário para assinatura
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -passin pass:android -passout pass:android
        
        # Alinhar e assinar o APK para o Android aceitar
        zipalign -p -f 4 app-unaligned.apk app-aligned.apk || cp app-unaligned.apk app-aligned.apk
        apksigner sign --ks debug.keystore --ks-keypass pass:android --ks-pass pass:android --out app/build/outputs/apk/debug/app-debug.apk app-aligned.apk || cp app-aligned.apk app/build/outputs/apk/debug/app-debug.apk

    - name: Registar Artefacto APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk